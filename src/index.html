<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C4F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1614" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dog Co.">
<meta name="format-detection" content="telephone=no">
<title>Nicole's Dog Co. Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a public site and an operator console share one shell; the console is dense, scannable rows with state pills, the site is roomy. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EAEFEB; --ink:#16302A; --muted:#5A6B66; --line:#D9E1DC;
  --accent:#1F5C4F; --accent-ink:#FFFFFF; --sun:#E0A13A; --sun-soft:#FBEFD9;
  --ok:#2F7D4F; --ok-soft:#E1F1E6; --warn:#A86E12; --warn-soft:#FBF0DA; --bad:#B0412D; --bad-soft:#F8E3DE; --info:#3E58A8; --info-soft:#E3E8F7;
  --c-walk:#1F7A63; --c-boarding:#4659A8; --c-daycare:#C2861F; --c-groom:#A9497A;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(16,40,34,.06), 0 4px 16px rgba(16,40,34,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614; --surface:#15201D; --surface-2:#1B2925; --ink:#E4EDE9; --muted:#97A9A3; --line:#273631;
    --accent:#5DB59C; --accent-ink:#08130F; --sun:#EDB75A; --sun-soft:#3A2E17;
    --ok:#6CC28E; --ok-soft:#173326; --warn:#E3B05A; --warn-soft:#382B12; --bad:#EE8A75; --bad-soft:#3B1E18; --info:#93A7EC; --info-soft:#1D2542;
    --c-walk:#5DB59C; --c-boarding:#8C9CE6; --c-daycare:#E3B05A; --c-groom:#E08DB6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --surface-2:#1B2925; --ink:#E4EDE9; --muted:#97A9A3; --line:#273631;
  --accent:#5DB59C; --accent-ink:#08130F; --sun:#EDB75A; --sun-soft:#3A2E17;
  --ok:#6CC28E; --ok-soft:#173326; --warn:#E3B05A; --warn-soft:#382B12; --bad:#EE8A75; --bad-soft:#3B1E18; --info:#93A7EC; --info-soft:#1D2542;
  --c-walk:#5DB59C; --c-boarding:#8C9CE6; --c-daycare:#E3B05A; --c-groom:#E08DB6;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.5vw,3.1rem);font-weight:800}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.brand svg{flex:none}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav a.admin-link{border:1px dashed var(--line)}
.banner{background:var(--sun-soft);color:var(--ink);font-size:.875rem;border-bottom:1px solid var(--line)}
.banner .wrap{padding-top:8px;padding-bottom:8px}

/* Buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1d1606}
.btn.sm{padding:5px 11px;font-size:.84rem}
.btn.ghost{background:transparent}
.social{display:flex;flex-direction:column;gap:10px}
.btn.sso{width:100%;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border-color:#dadce0;font-weight:600;min-height:46px}
.btn.sso:hover{background:#f7f8f8}
.btn.sso svg{width:20px;height:20px;flex:none}
.btn.sso.fb{background:#1877F2;border-color:#1877F2;color:#fff}
.btn.sso.fb:hover{filter:brightness(1.06);background:#1877F2}
.or{display:flex;align-items:center;gap:12px;color:var(--muted,#6b7280);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label{display:block;font-weight:600;font-size:.875rem;margin-bottom:4px}
.field{display:flex;flex-direction:column;min-width:0}
.field .hint{font-size:.8rem;color:var(--muted);margin-top:3px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill.requested{background:var(--warn-soft);color:var(--warn)}
.pill.confirmed{background:var(--info-soft);color:var(--info)}
.pill.in_progress{background:var(--sun-soft);color:var(--ink);border-color:var(--sun)}
.pill.completed{background:var(--ok-soft);color:var(--ok)}
.pill.declined,.pill.cancelled{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.unpaid{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.expiring{background:var(--warn-soft);color:var(--warn)}
.pill.expired,.pill.missing{background:var(--bad-soft);color:var(--bad)}
.cat{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.cat.walk{background:var(--c-walk)}.cat.boarding{background:var(--c-boarding)}.cat.daycare{background:var(--c-daycare)}.cat.groom{background:var(--c-groom)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Public site */
.hero{padding:56px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}}
.hero p.lede{font-size:1.15rem;color:var(--muted);max-width:52ch;margin-top:14px}
.hero .row{margin-top:24px}
.hero-card{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px}
.hero-card .k{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:700}
.hero-card .slot{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent)}
section.block{padding:40px 0}
section.block > .wrap > h2{margin-bottom:6px}
section.block > .wrap > p.muted{margin-bottom:22px;max-width:62ch}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c-walk)}
.svc.boarding{border-top-color:var(--c-boarding)}.svc.daycare{border-top-color:var(--c-daycare)}.svc.groom{border-top-color:var(--c-groom)}
.svc .price{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.svc .price small{font-family:var(--f-body);font-weight:500;font-size:.85rem;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:s}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
.steps li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;counter-increment:s}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sun);color:#1d1606;font-weight:800;margin-bottom:10px}
.steps{padding:0;margin:0}
.policy{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.policy{grid-template-columns:1fr}}
footer{padding:30px 0 50px;color:var(--muted);font-size:.875rem;border-top:1px solid var(--line);margin-top:30px}

/* Booking */
.book{display:grid;grid-template-columns:1fr 340px;gap:22px;padding:30px 0 50px;align-items:start}
@media (max-width:900px){.book{grid-template-columns:1fr}}
.stepcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.stepcard h3 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.85rem;margin-right:8px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--ink)}
.choice input{margin-top:4px;accent-color:var(--accent)}
.choice.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.choice > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.choice .t{font-weight:700;font-size:.95rem}
.choice .s{font-size:.82rem;color:var(--muted)}
.avail{padding:10px 12px;border-radius:8px;font-size:.9rem;font-weight:600}
.avail.ok{background:var(--ok-soft);color:var(--ok)}
.avail.bad{background:var(--bad-soft);color:var(--bad)}
.avail.warn{background:var(--warn-soft);color:var(--warn)}
.summary{position:sticky;top:80px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.summary .line{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.summary .total{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.errors{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:.9rem}
.errors ul{margin:4px 0 0;padding-left:18px}

/* Portal */
.portal{padding:30px 0 50px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:900px){.portal{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:160px}
.report{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.9rem;width:100%}
.report .ticks{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tick{font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

/* Admin */
.admin{display:grid;grid-template-columns:210px 1fr;gap:22px;padding:24px 0 50px;align-items:start}
@media (max-width:860px){.admin{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px}
@media (max-width:860px){.side{position:static;flex-direction:row;flex-wrap:wrap}}
.side button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.side button:hover{background:var(--surface-2);color:var(--ink)}
.side button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.side button:focus-visible{outline:3px solid var(--sun)}
.badge{background:var(--warn);color:var(--surface);border-radius:999px;font-size:.72rem;padding:1px 7px;font-weight:800}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:800}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:600}
.meter{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--c-boarding)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media (max-width:1050px){.two{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .row{gap:6px}
.visit{display:flex;gap:12px;align-items:center;padding:12px 14px;border-left:4px solid var(--c-walk);background:var(--surface);border-radius:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap}
.visit.boarding{border-left-color:var(--c-boarding)}.visit.daycare{border-left-color:var(--c-daycare)}.visit.groom{border-left-color:var(--c-groom)}
.visit .when{min-width:96px;font-weight:700;font-size:.88rem}
.visit .grow{flex:1;min-width:170px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--bad-soft);font-size:.9rem}
.alert.warn{background:var(--warn-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day h4{font-size:.9rem;display:flex;justify-content:space-between}
.chip{font-size:.8rem;padding:6px 8px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--c-walk);line-height:1.3}
.chip.boarding{border-left-color:var(--c-boarding)}.chip.daycare{border-left-color:var(--c-daycare)}.chip.groom{border-left-color:var(--c-groom)}
.chip.requested{border-style:dashed;border-width:1px 1px 1px 3px;border-color:var(--warn)}
.gantt{border-collapse:separate;border-spacing:0}
.gantt th,.gantt td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);min-width:42px;font-size:.8rem}
.gantt td.name,.gantt th.name{text-align:left;min-width:170px;padding-left:12px;position:sticky;left:0;background:var(--surface);z-index:1}
.gantt th.name{background:var(--surface-2)}
.gantt td.on span{display:block;height:22px;border-radius:5px;background:var(--c-boarding)}
.gantt td.on.req span{background:repeating-linear-gradient(45deg,var(--c-boarding),var(--c-boarding) 4px,transparent 4px,transparent 8px);border:1px solid var(--c-boarding)}
.gantt td.today{background:color-mix(in srgb,var(--sun) 14%,transparent)}
.occ{font-weight:700}
.occ.full{color:var(--bad)}
table.inv td,table.inv th{vertical-align:top}
table.inv tbody tr.first td{border-top:2px solid var(--line)}
table.inv tbody tr:not(.first) td{border-top:0}
table.inv tfoot td{background:var(--surface-2);border-bottom:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--surface-2);display:block}
.photos.big{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.upd{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.upd:first-child{border-top:0;padding-top:0}
.drop{position:relative;border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;display:block;font-weight:500}
.drop:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{all:unset;cursor:pointer;font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.chips button:hover{border-color:var(--ink)}
.chips button:focus-visible{outline:3px solid var(--sun)}
.ph-wrap{position:relative}
.ph-wrap button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.addon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.addon-grid .choice .s{display:block}
.addon-grid .price-tag{font-weight:700;font-size:.85rem;color:var(--ink)}
.ao-row{display:grid;grid-template-columns:1.6fr .6fr .9fr;gap:8px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.ao-row .svc-checks{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.ao-row .svc-checks label,.ao-row .flags label{display:flex;gap:5px;align-items:center;font-weight:500;font-size:.8rem;border:1px solid var(--line);padding:3px 9px;border-radius:999px;margin:0;cursor:pointer}
.ao-row .flags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:640px){.ao-row{grid-template-columns:1fr}}
.client-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.client-grid{grid-template-columns:1fr}}
.client-list button{all:unset;display:flex;justify-content:space-between;gap:8px;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;cursor:pointer}
.client-list button:hover{background:var(--surface-2)}
.client-list button[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.client-list button:focus-visible{outline:3px solid var(--sun)}
.pet{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

  const assets = !useStorage ? null : { upload: async (blob, opts) => {

    inner = '<form class="stack" data-form="newbooking"><h3>New booking</h3><p class="small muted">Bookings made here are confirmed straight away.</p><div class="grid2"><div class="field"><label for="nb-client">Client</label><select id="nb-client" name="clientId" required>' + S.clients.slice().sort((a, b) => a.name.localeCompare(b.name)).map(cl => '<option value="' + esc(cl.id) + '">' + esc(cl.name) + " (" + esc(petsOf(cl.id).map(p => p.name).join(", ")) + ")</option>").join("") + '</select><span class="hint">All of this client\'s dogs are booked in.</span></div><div class="field"><label for="nb-svc">Service</label><select id="nb-svc" name="serviceId">' + c.services.map(s => '<option value="' + esc(s.id) + '">' + esc(s.name) + "</option>").join("") + '</select></div><div class="field"><label for="nb-date">Date (drop-off for boarding)</label><input type="date" id="nb-date" name="date" required value="' + todayISO() + '"></div><div class="field"><label for="nb-end">Collection (boarding only)</label><input type="date" id="nb-end" name="endDate"></div><div class="field"><label for="nb-slot">Time or window</label><select id="nb-slot" name="slot"><option value="">All day</option>' + WALK_SLOTS.concat(GROOM_SLOTS).map(s => "<option>" + esc(s) + "</option>").join("") + '</select></div><div class="field"><label for="nb-staff">Assign to</label><select id="nb-staff" name="staffId"><option value="">Usual person (' + esc(defaultStaff(c, "groom").name || "") + " for grooming, " + esc(defaultStaff(c, "walk").name || "") + ' for the rest)</option>' + c.staff.map(s => '<option value="' + esc(s.id) + '">' + esc(s.name) + "</option>").join("") + "</select></div></div>" + '<div class="field"><span class="small" style="font-weight:600">Add-ons</span><span class="hint">Only add-ons that apply to the chosen service are added.</span><div class="checks" style="margin-top:6px">' + (c.addons || []).filter(a => a.active !== false).map(a => '<label><input type="checkbox" name="addon" value="' + esc(a.id) + '">' + esc(a.name) + ' <span class="muted small">' + money(a.price) + "</span></label>").join("") + "</div></div>" + (m.err ? '<div class="errors" role="alert">' + esc(m.err) + "</div>" : "") + '<div class="row end"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Add booking</button></div></form>';
  }
  return '<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">' + inner + "</div></div>";
}

// ----- events -----
const UNDO_ACTS = new Set(["approve", "decline", "cancel", "start", "pay", "pay-all", "approve-clean", "client-approve", "cust-cancel", "prices-clear", "wrap-tick"]);
const UNDO_FORMS = new Set(["report", "approve", "decline", "prices", "client", "pet", "newbooking"]);
document.addEventListener("click", async (e) => {
  const el0 = e.target.closest("[data-act]"); if (!el0) return;
  const u = UNDO_ACTS.has(el0.dataset.act); if (u) beginUndo();
  try { await handleClick(e); } finally { if (u) endUndo(); }
});
async function handleClick(e) {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act; const id = el.dataset.id;
  if (act === "scrim" && e.target !== el) return;
  switch (act) {
    case "scrim": case "close": S.modal = null; render(); break;
    case "book-svc": S.draft = { repeat: 1, serviceId: id }; S.done = null; S.errors = []; location.hash = "book"; render(); break;
    case "book-again": S.done = null; render(); break;
    case "submit-booking": await submitBooking(); break;
    case "sso": await ssoSignIn(id); break;
    case "signout": ssoSignOut(); S.me = null; remember(); S.draft = { repeat: 1, serviceId: S.draft.serviceId }; render(); break;
    case "cust-cancel": await patchBooking(id, { status: "cancelled" }); toast("Booking cancelled"); break;
    case "tab": S.adminTab = id; S.lastSub[groupOf(id)] = id; S.modal = null; if (id === "messages" && S.thread) markRead(S.thread, "team"); location.hash = "admin"; render(); window.scrollTo(0, 0); break;
    case "bfilter": S.bFilter = id; render(); break;
    case "approve": await patchBooking(id, { status: "confirmed" }); toast("Confirmed"); break;
    case "decline": await patchBooking(id, { status: "declined" }); toast("Declined"); break;
    case "cancel": await patchBooking(id, { status: "cancelled" }); toast("Cancelled"); break;
    case "start": await patchBooking(id, { status: "in_progress" }); toast("Checked in"); break;
    case "complete": S.modal = { type: "report", id }; render(); break;
    case "review": S.modal = { type: "approve", id }; render(); break;
    case "prices-open": S.modal = { type: "prices", id }; render(); break;
    case "install": if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (er) {} installEvt = null; render(); } else S.modal = { type: "ios-install" }, render(); break;
    case "install-later": try { localStorage.setItem("dogco-install-later", todayISO()); } catch (er) {} render(); break;
    case "sw-update": if (S.swWaiting) S.swWaiting.postMessage("SKIP_WAITING"); break;
    case "load-sample": beginUndo(); try { await loadSampleData(); toast("Sample data loaded"); } finally { endUndo(); } break;
    case "nums": S.showNums = !S.showNums; try { localStorage.setItem("dogco-nums", S.showNums ? "1" : ""); } catch (er) {} render(); break;
    case "undo": await runUndo(); break;
    case "comfort-open": S.modal = { type: "comfort" }; render(); break;
    case "wrap-tick": { const t = todayISO(); const cur = (S.days || []).find(x => x.id === t) || { id: t }; await put("days", Object.assign({}, cur, { [id]: true })); toast(id === "money" ? "Money checked" : "Tomorrow checked"); break; }
    case "settab": { S.setTab = id; document.querySelectorAll("[data-sec]").forEach(x => { x.hidden = x.dataset.sec !== id; }); document.querySelectorAll("[data-act=settab]").forEach(x => { const on = x.dataset.id === id; x.classList.toggle("on", on); x.setAttribute("aria-selected", on ? "true" : "false"); }); break; }
    case "dayoff-add": { const inp = document.getElementById("s-dayoff"); const hid = document.getElementById("s-daysoff"); if (!inp || !hid || !inp.value) break; const list = new Set(hid.value ? hid.value.split(",") : []); list.add(inp.value); hid.value = [...list].sort().join(","); drawDaysOff(); inp.value = ""; break; }
    case "dayoff-rm": { const hid = document.getElementById("s-daysoff"); if (!hid) break; hid.value = hid.value.split(",").filter(x => x && x !== id).join(","); drawDaysOff(); break; }
    case "addon-new": S.newAddons = (S.newAddons || []).concat([{ id: "a-" + Date.now().toString(36), name: "New add-on", desc: "", price: 0, per: "dog", services: [], active: true }]); render(); break;
    case "msg-to": { const cid = el.dataset.client; S.adminTab = "messages"; S.thread = cid; S.cmp = { key: "team:" + cid, text: "", photos: [], pets: (el.dataset.pets || "").split(",").filter(Boolean), err: "" }; if (location.hash !== "#admin") location.hash = "admin"; render(); window.scrollTo(0, 0); markRead(cid, "team"); break; }
    case "thread": openThread(id); break;
    case "thread-close": S.thread = null; render(); break;
    case "cmp-send": await sendMessage(); break;
    case "cmp-rm": if (S.cmp) { S.cmp.photos.splice(Number(id), 1); render(); } break;
    case "cmp-quick": if (S.cmp) { S.cmp.text = (S.cmp.text ? S.cmp.text.trim() + " " : "") + id + "."; render(); const t = document.getElementById("cmp-text"); if (t) t.focus(); } break;
    case "copy-client": await copyText(toTSV(invoiceRows([id])), "Invoice lines for " + ((client(id) || {}).name || "client")); break;
    case "csv-client": { const cl = client(id) || { name: "client" }; await saveCSV(invoiceNo(cl) + ".csv", invoiceRows([id])); break; }
    case "copy-all": { const ids = [...new Set(S.bookings.filter(b => b.status === "completed" && !b.paid).map(b => b.clientId))]; await copyText(toTSV(invoiceRows(ids)), "All invoice lines"); break; }
    case "csv-all": { const ids = [...new Set(S.bookings.filter(b => b.status === "completed" && !b.paid).map(b => b.clientId))]; await saveCSV("unpaid-invoice-lines-" + todayISO() + ".csv", invoiceRows(ids)); break; }
    case "prices-clear": { const cl = client(id); S.modal = null; if (cl) { await put("clients", Object.assign({}, cl, { prices: {} })); toast(cl.name + " now pays standard prices"); } break; }
    case "decline-open": S.modal = { type: "decline", id }; render(); break;
    case "csel-go": S.cSel = id; S.adminTab = "clients"; render(); window.scrollTo(0, 0); break;
    case "client-approve": { const cl = client(id); if (cl) { await put("clients", Object.assign({}, cl, { approved: true })); toast(cl.name + " approved"); } break; }
    case "approve-clean": { const list = S.bookings.filter(b => b.status === "requested" && !approvalChecks(b).some(x => x.lvl !== "ok")); for (const b of list) await patchBooking(b.id, { status: "confirmed", staffId: b.staffId || defaultStaff(C(), b.cat).id, decision: { by: "Bulk approval", at: new Date().toISOString(), message: "" } }); toast(list.length + " approved and added to the diary"); break; }
    case "week": S.weekStart = id === "0" ? null : addDays(S.weekStart || todayISO(), Number(id)); render(); break;
    case "csel": S.cSel = id; render(); break;
    case "client-new": S.modal = { type: "client" }; render(); break;
    case "client-edit": S.modal = { type: "client", id }; render(); break;
    case "pet-new": S.modal = { type: "pet", client: el.dataset.client }; render(); break;
    case "pet-edit": S.modal = { type: "pet", id }; render(); break;
    case "new-booking": if (!S.clients.length) { toast("Add a client first"); break; } S.modal = { type: "newbooking" }; render(); break;
    case "pay": await patchBooking(id, { paid: true }); toast("Marked paid"); break;
    case "pay-all": for (const b of S.bookings.filter(x => x.clientId === id && x.status === "completed" && !x.paid)) await patchBooking(b.id, { paid: true }); toast("All marked paid"); break;
    case "reset-demo": startDemo(); toast("Demo data reset"); break;
  }
}

document.addEventListener("keydown", (e) => { if (e.target.id === "cmp-text" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendMessage(); return; } if (e.key === "Escape" && S.modal) { S.modal = null; render(); } });
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.m && S.modal) { S.modal[el.dataset.m] = el.value; if (el.dataset.m === "message") S.modal.msgEdited = true; return; }
  if (el.dataset.c && S.cmp) { S.cmp[el.dataset.c] = el.value; return; }
  if (el.dataset.q) { S.cQuery = el.value; render(); return; }
  if (el.dataset.d && el.type !== "radio" && el.type !== "checkbox" && el.tagName !== "SELECT" && el.type !== "date" && !("rr" in el.dataset)) S.draft[el.dataset.d] = el.value;
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset.m && S.modal) { S.modal[el.dataset.m] = el.value; if (el.dataset.m === "reason") render(); return; }
  if (el.dataset.cpet && S.cmp) { const set = new Set(S.cmp.pets || []); el.checked ? set.add(el.dataset.cpet) : set.delete(el.dataset.cpet); S.cmp.pets = [...set]; return; }
  if ((el.id === "cmp-files" || el.id === "cmp-cam") && S.cmp) {
    const room = Math.max(0, 4 - S.cmp.photos.length); const files = [...el.files].slice(0, room); S.cmp.err = "";
    for (const f of files) { try { const r = await shrink(f, 1600, 0.82); S.cmp.photos.push({ blob: r.blob, preview: URL.createObjectURL(r.blob) }); } catch (err) { S.cmp.err = err.message || "Couldn't read that photo."; } }
    if (el.files.length > files.length) S.cmp.err = "Up to 4 photos per message.";
    render(); return;
  }
  if (el.dataset.comfort) { setComfort(el.dataset.comfort, el.checked); return; }
  if (el.dataset.change === "thread") { if (el.value) openThread(el.value); return; }
  if (el.dataset.change === "as") { S.staffId = el.value; return; }
  if (el.dataset.change === "assign") { beginUndo(); try { await patchBooking(el.dataset.id, { staffId: el.value }); toast(el.value ? "Assigned to " + staffName(el.value) : "Unassigned"); } finally { endUndo(); } return; }
  if (el.dataset.addon) { const set = new Set(S.draft.addons || []); el.checked ? set.add(el.dataset.addon) : set.delete(el.dataset.addon); S.draft.addons = [...set]; render(); return; }
  if (el.dataset.pet) { const set = new Set(S.draft.petIds || []); el.checked ? set.add(el.dataset.pet) : set.delete(el.dataset.pet); S.draft.petIds = [...set]; render(); return; }
  if (el.dataset.d) {
    S.draft[el.dataset.d] = el.value;
    if (el.dataset.d === "serviceId") { S.draft.slot = ""; S.errors = []; const ok = addonsFor(C(), el.value).map(a => a.id); S.draft.addons = (S.draft.addons || []).filter(x => ok.includes(x)); }
    if (el.dataset.d === "date" && S.draft.endDate && S.draft.endDate <= el.value) S.draft.endDate = "";
    if ("rr" in el.dataset) render();
  }
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const u = UNDO_FORMS.has(e.target.dataset.form); if (u) beginUndo();
  try { await handleSubmit(e); } finally { if (u) endUndo(); }
});
async function handleSubmit(e) {
  const f = e.target; const fd = new FormData(f); const kind = f.dataset.form;
  if (kind === "signin") {
    const em = String(fd.get("email") || "").trim().toLowerCase(); S.portalEmail = em;
    const cl = S.clients.find(c => (c.email || "").toLowerCase() === em);
    if (cl) { S.me = cl.id; S.portalErr = ""; remember(); if (view() === "messages") markRead(cl.id, "client"); } else S.portalErr = "We couldn't find a booking under that email. Check the spelling, or make your first booking.";
    render(); return;
  }
  if (kind === "report") {
    const b = S.bookings.find(x => x.id === S.modal.id);
    const report = { mood: fd.get("mood"), ticks: fd.getAll("tick"), note: String(fd.get("note") || ""), staffId: fd.get("staffId"), at: new Date().toISOString() };
    S.modal = null;
    await patchBooking(b.id, { status: "completed", report, staffId: b.staffId || report.staffId }); toast("Visit completed, report sent"); return;
  }
  if (kind === "prices") {
    const cl = client(S.modal.id); if (!cl) return;
    const num = v => { const x = String(v == null ? "" : v).trim(); return x === "" || isNaN(Number(x)) ? null : Number(x); };
    const prices = {};
    C().services.forEach(sv => {
      if (sv.sizes) { const o = {}; ["S", "M", "L"].forEach(z => { const v = num(fd.get("cp_" + sv.id + "_" + z)); if (v != null) o[z] = v; }); if (Object.keys(o).length) prices[sv.id] = o; }
      else { const v = num(fd.get("cp_" + sv.id)); if (v != null) prices[sv.id] = v; }
    });
    S.modal = null;
    await put("clients", Object.assign({}, cl, { prices, active: fd.get("active") === "on" }));
    toast("Prices saved for " + cl.name); return;
  }
  if (kind === "approve" || kind === "decline") {
    const b = S.bookings.find(x => x.id === S.modal.id); if (!b) return;
    const targets = fd.get("series") === "on" ? seriesPending(b) : [b];
    const decision = { by: String(fd.get("by") || ""), at: new Date().toISOString(), message: String(fd.get("message") || "").trim() };
    if (kind === "decline") decision.reason = String(fd.get("reason") || "");
    const staffId = String(fd.get("staffId") || "");
    const approveClient = fd.get("approveClient") === "on";
    S.modal = null;
    for (const x of targets) await patchBooking(x.id, kind === "approve" ? Object.assign({ status: "confirmed", decision }, staffId ? { staffId } : {}) : { status: "declined", decision });
    if (approveClient) { const cl = client(b.clientId); if (cl) await put("clients", Object.assign({}, cl, { approved: true })); }
    toast(kind === "approve" ? (targets.length > 1 ? targets.length + " visits approved" : "Approved and added to the diary") : "Request declined");
    return;
  }
  if (kind === "pet") {
    const m = S.modal; const base = m.id ? pet(m.id) : { id: uid("p"), clientId: m.client };
    const p = Object.assign({}, base, { name: String(fd.get("name")).trim(), breed: fd.get("breed"), weight: Number(fd.get("weight")) || 0, born: fd.get("born"), sex: fd.get("sex"), vet: fd.get("vet"), feeding: fd.get("feeding"), temperament: fd.get("temperament"), flags: fd.getAll("flag"), vax: { rabies: fd.get("vax_rabies") || "", dhpp: fd.get("vax_dhpp") || "", bordetella: fd.get("vax_bordetella") || "" } });
    S.modal = null; await put("pets", p); toast("Saved " + p.name); return;
  }
  if (kind === "client") {
    const m = S.modal; const base = m.id ? client(m.id) : { id: uid("c"), approved: true, createdAt: new Date().toISOString() };
    const cl = Object.assign({}, base, { name: String(fd.get("name")).trim(), email: String(fd.get("email")).trim(), phone: fd.get("phone"), address: fd.get("address"), notes: fd.get("notes") });
    S.modal = null; S.cSel = cl.id; await put("clients", cl); toast("Saved " + cl.name); return;
  }
  if (kind === "newbooking") {
    const svc = svcById(fd.get("serviceId")); const cid = fd.get("clientId"); const pets = petsOf(cid);
    const d = { date: fd.get("date"), endDate: fd.get("endDate"), slot: fd.get("slot") };
    if (!pets.length) { S.modal.err = "This client has no dogs on file. Add one first."; render(); return; }
    if (svc.cat === "boarding" && (!d.endDate || d.endDate <= d.date)) { S.modal.err = "Boarding needs a collection date after drop-off."; render(); return; }
    const av = availability(C(), S.bookings, svc, Object.assign({}, d, { slot: d.slot || "x" }), pets.length);
    if (!av.ok) { S.modal.err = av.msg; render(); return; }
    const b = { id: uid("b"), serviceId: svc.id, cat: svc.cat, clientId: cid, petIds: pets.map(p => p.id), date: d.date, endDate: svc.cat === "boarding" ? d.endDate : "", slot: svc.cat === "boarding" || svc.cat === "daycare" ? "" : d.slot, status: "confirmed", staffId: fd.get("staffId") || defaultStaff(C(), svc.cat).id, notes: "", paid: false, report: null, createdAt: new Date().toISOString() };
    const ps = clientSvc(svc, client(cid));
    b.addons = pricedAddons(C(), fd.getAll("addon"), svc, pets, b.date, b.endDate);
    b.price = priceFor(ps, pets, b.date, b.endDate) + addonTotal(b.addons);
    b.lines = buildLines(ps, pets, b.date, b.endDate).concat(addonLines(b.addons, pets, svc.cat === "boarding" ? daysBetween(b.date, b.endDate) : 1));
    S.modal = null; await put("bookings", b); toast("Booking added"); return;
  }
  if (kind === "settings") {
    const c = C();
    const oldStaff = c.staff;
    const staff = String(fd.get("staff") || "").split("\n").map(l => l.trim()).filter(Boolean).map((l, i) => { const [name, role, max] = l.split(",").map(x => (x || "").trim()); const prev = oldStaff.find(s => s.name.toLowerCase() === name.toLowerCase()); return { id: prev ? prev.id : "s" + Date.now().toString(36) + i, name, role: role || "Team", max: Number(max) || 0 }; });
    const services = c.services.map(s => { const n = Object.assign({}, s); n.approval = fd.get("appr_" + s.id) === "on"; if (s.sizes) n.sizes = { S: Number(fd.get("price_" + s.id + "_S")) || 0, M: Number(fd.get("price_" + s.id + "_M")) || 0, L: Number(fd.get("price_" + s.id + "_L")) || 0 }; else n.price = Number(fd.get("price_" + s.id)) || 0; return n; });
    const cfg = Object.assign({}, c, { businessName: fd.get("businessName") || c.businessName, tagline: fd.get("tagline"), area: fd.get("area"), phone: fd.get("phone"), email: fd.get("email"), currency: fd.get("currency"), newClientApproval: fd.get("newClientApproval") === "on", trustKnown: fd.get("trustKnown") === "on", quiet: fd.get("quiet") === "on", quietStart: Number(fd.get("quietStart")), quietEnd: Number(fd.get("quietEnd")), daysOff: String(fd.get("daysOff") || "").split(",").filter(Boolean), publicPriceFloor: fd.get("publicPriceFloor") === "on",  kennelRuns: Number(fd.get("kennelRuns")) || 0, daycareCap: Number(fd.get("daycareCap")) || 0, groupWalkCap: Number(fd.get("groupWalkCap")) || 1, staff, services, addons: (c.addons || []).concat(S.newAddons || []).filter(a => fd.get("ao_del_" + a.id) !== "on").map(a => ({ id: a.id, name: String(fd.get("ao_name_" + a.id) || a.name).trim() || "Add-on", desc: String(fd.get("ao_desc_" + a.id) || ""), price: Number(fd.get("ao_price_" + a.id)) || 0, per: fd.get("ao_per_" + a.id) || "dog", services: fd.getAll("ao_svc_" + a.id), active: fd.get("ao_active_" + a.id) === "on" })) });
    S.newAddons = [];
    try { await putCfg(cfg); toast("Settings saved"); } catch (err) {}
  }
}


try { S.me = sessionStorage.getItem("dogco-me"); S.showNums = localStorage.getItem("dogco-nums") === "1"; } catch (e) {}
boot();
