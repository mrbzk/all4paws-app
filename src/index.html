<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ALL4PAWS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="ALL4PAWS">
<meta name="format-detection" content="telephone=no">
<title>Nicole's Dog Co. Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a public site and an operator console share one shell; the console is dense, scannable rows with state pills, the site is roomy. */
:root{
  --bg:#FAFAFB; --surface:#FFFFFF; --surface-2:#F4F1F3; --ink:#2A1F26; --muted:#6B5F66; --line:#ECE6EA;
  --accent:#C2187A; --accent-ink:#FFFFFF; --sun:#F7B5CB; --sun-soft:#FDEEF4;
  --ok:#0057A0; --ok-soft:#E3EEF8; --warn:#A86E12; --warn-soft:#FBF0DA; --bad:#B0412D; --bad-soft:#F8E3DE; --info:#0057A0; --info-soft:#E3EEF8;
  --c-walk:#0057A0; --c-boarding:#7A3FA8; --c-daycare:#C2861F; --c-groom:#A9497A;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(40,20,30,.05), 0 4px 16px rgba(40,20,30,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="system-dark"]{
    --bg:#0E1614; --surface:#15201D; --surface-2:#1B2925; --ink:#E4EDE9; --muted:#97A9A3; --line:#273631;
    --accent:#5DB59C; --accent-ink:#08130F; --sun:#EDB75A; --sun-soft:#3A2E17;
    --ok:#6CC28E; --ok-soft:#173326; --warn:#E3B05A; --warn-soft:#382B12; --bad:#EE8A75; --bad-soft:#3B1E18; --info:#93A7EC; --info-soft:#1D2542;
    --c-walk:#5DB59C; --c-boarding:#8C9CE6; --c-daycare:#E3B05A; --c-groom:#E08DB6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --surface-2:#1B2925; --ink:#E4EDE9; --muted:#97A9A3; --line:#273631;
  --accent:#5DB59C; --accent-ink:#08130F; --sun:#EDB75A; --sun-soft:#3A2E17;
  --ok:#6CC28E; --ok-soft:#173326; --warn:#E3B05A; --warn-soft:#382B12; --bad:#EE8A75; --bad-soft:#3B1E18; --info:#93A7EC; --info-soft:#1D2542;
  --c-walk:#5DB59C; --c-boarding:#8C9CE6; --c-daycare:#E3B05A; --c-groom:#E08DB6;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.5vw,3.1rem);font-weight:800}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.brand svg{flex:none}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav a.admin-link{border:1px dashed var(--line)}
.modesw{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2,var(--line));border:1px solid var(--line);margin-left:auto}
.modesw button{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.modesw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modesw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modesw + .nav{margin-left:8px}
.navsection[data-sec=logins] ul.list{list-style:none;padding:0;margin:0}
[hidden]{display:none!important}
body.admin-mode{padding-bottom:0!important}
@media (max-width:640px){
  .top .wrap{flex-wrap:nowrap;gap:8px}
  .brand{min-width:0;font-size:1rem}
  .brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modesw{flex:none}
  .modesw button{padding:6px 11px;font-size:.8rem}
}

.banner{background:var(--sun-soft);color:var(--ink);font-size:.875rem;border-bottom:1px solid var(--line)}
.banner .wrap{padding-top:8px;padding-bottom:8px}

/* Buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1d1606}
.btn.sm{padding:5px 11px;font-size:.84rem}
.btn.ghost{background:transparent}
.social{display:flex;flex-direction:column;gap:10px}
.btn.sso{width:100%;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border-color:#dadce0;font-weight:600;min-height:46px}
.btn.sso:hover{background:#f7f8f8}
.btn.sso svg{width:20px;height:20px;flex:none}
.btn.sso.fb{background:#1877F2;border-color:#1877F2;color:#fff}
.btn.sso.fb:hover{filter:brightness(1.06);background:#1877F2}
.authtabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:999px}
.authtabs button{all:unset;flex:1;text-align:center;padding:9px 12px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--ink)}
.authtabs button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.authtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted,#6b7280);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label{display:block;font-weight:600;font-size:.875rem;margin-bottom:4px}
.field{display:flex;flex-direction:column;min-width:0}
.field .hint{font-size:.8rem;color:var(--muted);margin-top:3px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=url],input[type=password],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill.requested{background:var(--warn-soft);color:var(--warn)}
.pill.confirmed{background:var(--info-soft);color:var(--info)}
.pill.in_progress{background:var(--sun-soft);color:var(--ink);border-color:var(--sun)}
.pill.completed{background:var(--ok-soft);color:var(--ok)}
.pill.declined,.pill.cancelled{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.unpaid{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.expiring{background:var(--warn-soft);color:var(--warn)}
.pill.expired,.pill.missing{background:var(--bad-soft);color:var(--bad)}
.cat{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.cat.walk{background:var(--c-walk)}.cat.boarding{background:var(--c-boarding)}.cat.daycare{background:var(--c-daycare)}.cat.groom{background:var(--c-groom)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Public site */
.hero{padding:56px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}}
.hero p.lede{font-size:1.15rem;color:var(--muted);max-width:52ch;margin-top:14px}
.hero .row{margin-top:24px}
.hero-card{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px}
.hero-card .k{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:700}
.hero-card .slot{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent)}
section.block{padding:40px 0}
section.block > .wrap > h2{margin-bottom:6px}
section.block > .wrap > p.muted{margin-bottom:22px;max-width:62ch}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c-walk)}
.svc.boarding{border-top-color:var(--c-boarding)}.svc.daycare{border-top-color:var(--c-daycare)}.svc.groom{border-top-color:var(--c-groom)}
.svc .price{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.svc .price small{font-family:var(--f-body);font-weight:500;font-size:.85rem;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:s}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
.steps li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;counter-increment:s}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sun);color:#1d1606;font-weight:800;margin-bottom:10px}
.steps{padding:0;margin:0}
.policy{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.policy{grid-template-columns:1fr}}
footer{padding:30px 0 50px;color:var(--muted);font-size:.875rem;border-top:1px solid var(--line);margin-top:30px}

/* Booking */
.book{display:grid;grid-template-columns:1fr 340px;gap:22px;padding:30px 0 50px;align-items:start}
@media (max-width:900px){.book{grid-template-columns:1fr}}
.stepcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.stepcard h3 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.85rem;margin-right:8px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--ink)}
.choice input{margin-top:4px;accent-color:var(--accent)}
.choice.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.choice > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.choice .t{font-weight:700;font-size:.95rem}
.choice .s{font-size:.82rem;color:var(--muted)}
.avail{padding:10px 12px;border-radius:8px;font-size:.9rem;font-weight:600}
.avail.ok{background:var(--ok-soft);color:var(--ok)}
.avail.bad{background:var(--bad-soft);color:var(--bad)}
.avail.warn{background:var(--warn-soft);color:var(--warn)}
.summary{position:sticky;top:80px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.summary .line{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.summary .total{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.errors{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:.9rem}
.errors ul{margin:4px 0 0;padding-left:18px}

/* Portal */
.portal{padding:30px 0 50px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:900px){.portal{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:160px}
.report{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.9rem;width:100%}
.report .ticks{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tick{font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

/* Admin */
.admin{display:grid;grid-template-columns:210px 1fr;gap:22px;padding:24px 0 50px;align-items:start}
@media (max-width:860px){.admin{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px}
.side .lbl-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.side .lbl-row svg{width:18px;height:18px;flex:none}
.side .more,.more-sheet,.more-back{display:none}

.side button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.side button:hover{background:var(--surface-2);color:var(--ink)}
.side button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.side button:focus-visible{outline:3px solid var(--sun)}
.badge{background:var(--warn);color:var(--surface);border-radius:999px;font-size:.72rem;padding:1px 7px;font-weight:800}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:800}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:600}
.meter{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--c-boarding)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media (max-width:1050px){.two{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .row{gap:6px}
.visit{display:flex;gap:12px;align-items:center;padding:12px 14px;border-left:4px solid var(--c-walk);background:var(--surface);border-radius:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap}
.visit.boarding{border-left-color:var(--c-boarding)}.visit.daycare{border-left-color:var(--c-daycare)}.visit.groom{border-left-color:var(--c-groom)}
.visit .when{min-width:96px;font-weight:700;font-size:.88rem}
.visit .grow{flex:1;min-width:170px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--bad-soft);font-size:.9rem}
.alert.warn{background:var(--warn-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day h4{font-size:.9rem;display:flex;justify-content:space-between}
.chip{font-size:.8rem;padding:6px 8px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--c-walk);line-height:1.3}
.chip.boarding{border-left-color:var(--c-boarding)}.chip.daycare{border-left-color:var(--c-daycare)}.chip.groom{border-left-color:var(--c-groom)}
.diary-bar{justify-content:space-between;align-items:center;gap:10px}
.seg{display:inline-flex;gap:4px;flex-wrap:nowrap}
.range-form{gap:8px;align-items:center}
.range-form input[type=date]{width:auto;min-width:0;padding:6px 10px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.mcell{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:96px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.mcell:hover{border-color:var(--accent)}
.mcell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mcell.blank{background:transparent;border:0;cursor:default}
.mcell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mcell.sel{background:var(--surface-2);border-color:var(--accent)}
.mcell.closed{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px)}
.mtop{display:flex;justify-content:space-between;align-items:center}
.mnum{font-weight:700;font-size:.85rem}
.mcount{font-size:.7rem;background:var(--surface-2);border-radius:999px;padding:0 6px;font-weight:700}
.mlist{display:flex;flex-direction:column;gap:2px;min-width:0}
.mchip{font-size:.7rem;padding:1px 5px;border-radius:4px;background:var(--surface-2);border-left:3px solid var(--c-walk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip.boarding{border-left-color:var(--c-boarding)}.mchip.daycare{border-left-color:var(--c-daycare)}.mchip.groom{border-left-color:var(--c-groom)}
.mdots{display:none;gap:3px;flex-wrap:wrap}
.agenda{display:flex;flex-direction:column;gap:10px}
.aday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.aday.today{border-color:var(--accent)}
.aday h4{font-size:.9rem;display:flex;justify-content:space-between;margin-bottom:6px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}

// Firebase (Firestore + Storage) adapter with the same calls the app already uses. Used by the installable app on its own domain.
async function firebaseBackend(conf) {

  FB_APP = app; FB_AUTH = { M: AU, auth: AU.getAuth(app) }; setTimeout(ssoRedirectResult, 0);

  let fdb; try { fdb = F.initializeFirestore(app, { localCache: F.memoryLocalCache() }); } catch (e) { fdb = F.getFirestore(app); }
  const code = e => (e && e.code === "permission-denied" ? "invalid_argument" : e && e.code === "resource-exhausted" ? "resource_exhausted" : "unavailable");
  const wrap = sn => ({ id: sn.id, exists: sn.exists(), data: () => sn.data(), metadata: { fromCache: sn.metadata.fromCache, hasPendingWrites: sn.metadata.hasPendingWrites } });
  const docRef = path => { const r = F.doc(fdb, path); return { id: r.id, path,
    get: async () => wrap(await F.getDoc(r)),
    set: d => F.setDoc(r, d).catch(e => { throw { code: code(e), message: e.message }; }),
    update: d => F.updateDoc(r, d).catch(e => { throw { code: code(e), message: e.message }; }),
    delete: () => F.deleteDoc(r),
    onSnapshot: (next, err) => F.onSnapshot(r, { includeMetadataChanges: true }, sn => next(wrap(sn)), e => err && err({ code: code(e), message: e.message })) }; };

  const fail = err => e => err && err({ code: code(e), message: e.message });
  const colRef = path => ({ path,
    where: (field, op, val) => { const q = F.query(F.collection(fdb, path), F.where(field, op, val)); return {
      get: async () => qsnap(await F.getDocs(q)),
      onSnapshot: (next, err) => F.onSnapshot(q, { includeMetadataChanges: true }, qs => next(qsnap(qs)), fail(err)) }; },
    doc: id => docRef(path + "/" + (id || F.doc(F.collection(fdb, path)).id)),
    onSnapshot: (next, err) => F.onSnapshot(F.collection(fdb, path), { includeMetadataChanges: true }, qs => next({ docs: qs.docs.map(wrap), size: qs.size, empty: qs.empty, metadata: { fromCache: qs.metadata.fromCache, hasPendingWrites: qs.metadata.hasPendingWrites } }), e => err && err({ code: code(e), message: e.message })) });
  // Photos are saved (resized) inside the database by default, which needs no paid plan; set useStorage: true once Storage (Blaze plan) is set up
  const useStorage = !!(conf.storageBucket && conf.useStorage === true);
  const stor = useStorage ? ST.getStorage(app) : null;
  const assets = !useStorage ? null : { upload: async (blob, opts) => {
    const r = ST.ref(stor, "photos/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + ".jpg");
    try { await ST.uploadBytes(r, blob, { contentType: (opts && opts.type) || blob.type || "image/jpeg" }); } catch (e) { throw { code: e && e.code === "storage/quota-exceeded" ? "quota_or_state" : "upstream_error", message: e && e.message }; }
    return { id: "", url: await ST.getDownloadURL(r), contentType: "image/jpeg" };
  } };
  return { db: { doc: docRef, collection: colRef }, assets };
}

  const arrived = (snap) => { if (!snap.metadata.fromCache) { got++; if (got >= 7) { clearTimeout(timer); S.netNote = ""; } } render(); };
  const fail = (e) => { clearTimeout(timer); S.netNote = "The live data connection stopped (" + (e && e.code) + "). Reopen the page to reconnect."; render(); };
  db.doc("config/main").onSnapshot(snap => { S.cfg = snap.exists ? snap.data() : null; arrived(snap); }, fail);

async function stripeConnectReturn() {
  const q = new URLSearchParams(location.search);
  if (!q.has("state") || !(q.has("code") || q.has("error"))) return;
  const code = q.get("code") || "", state = q.get("state") || "", err = q.get("error_description") || q.get("error") || "";
  ["code", "state", "scope", "error", "error_description"].forEach(k => q.delete(k));
  try { history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash); } catch (e) {}
  const isG = state.startsWith("g_");
  if (err) { setTimeout(() => toast(/denied/i.test(err) ? (isG ? "Google Calendar connection cancelled." : "Stripe connection cancelled.") : (isG ? "Google said: " : "Stripe said: ") + err), 600); return; }
  if (isG) {
    try { if (FB_AUTH && FB_AUTH.auth.authStateReady) await FB_AUTH.auth.authStateReady(); } catch (e) {}
    for (let i = 0; i < 40 && !S.canAdmin; i++) await new Promise(r => setTimeout(r, 250));
    if (!S.canAdmin) { toast("Sign in to the back office, then click Connect Google Calendar again."); return; }
    toast("Finishing the Google Calendar connection...");
    try { const r = await callFn("googleConnectFinish", { code, state }); S.gStatus = r; toast("Google Calendar connected" + (r && r.email ? " (" + r.email + ")" : "") + "."); }
    catch (e) { toast((e && e.message) || "Couldn't finish connecting Google Calendar."); S.gStatus = undefined; }
    S.adminTab = "settings"; S.setTab = "integrations"; render(); return;
  }
  try { if (FB_AUTH && FB_AUTH.auth.authStateReady) await FB_AUTH.auth.authStateReady(); } catch (e) {}
  for (let i = 0; i < 40 && !S.canAdmin; i++) await new Promise(r => setTimeout(r, 250));
  if (!S.canAdmin) { toast("Sign in to the back office, then click Connect with Stripe again."); return; }
  toast("Finishing the Stripe connection...");
  try { const r = await callFn("stripeConnectFinish", { code, state }); S.stripeStatus = r; toast("Stripe connected" + (r && r.account ? " to " + r.account : "") + "."); }
  catch (e) { toast((e && e.message) || "Couldn't finish connecting Stripe."); S.stripeStatus = undefined; }
  S.adminTab = "settings"; S.setTab = "integrations"; render();
}
async function paidReturn() {
  const q = new URLSearchParams(location.search); const back = q.has("paid"); const ok = q.get("paid") === "1"; const cs = q.get("cs") || "";
  if (back) { q.delete("paid"); q.delete("cs"); try { history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash); } catch (e) {} }
  if (back && !ok) setTimeout(() => toast("Payment cancelled. Nothing was charged."), 600);
  // Wait for sign-in and settings, then ask the server to check open payments with Stripe (no webhook needed).
  try { if (FB_AUTH && FB_AUTH.auth.authStateReady) await FB_AUTH.auth.authStateReady(); } catch (e) {}
  for (let i = 0; i < 40 && !S.cfg; i++) await new Promise(r => setTimeout(r, 250));
  if (!FB_AUTH || !FB_AUTH.auth.currentUser || !cardsOn()) { if (back && ok) toast("Thanks. Your payment will show here shortly."); return; }
  if (back && ok) toast("Checking your payment with Stripe...");
  try {
    const r = await callFn("confirmCheckout", cs && ok ? { sessionId: cs } : {});
    if (back && ok) toast(r && r.paid ? "Payment received, thank you." : "Stripe is still processing your payment. It will show here once it clears.");
    else if (r && r.paid && S.canAdmin) toast(r.paid + (r.paid === 1 ? " card payment" : " card payments") + " recorded from Stripe.");
  } catch (e) { if (back && ok) toast("Thanks. Your payment will show here shortly."); }
}

 esc(a.id) + '">' + esc(a.name) + ' <span class="muted small">' + money(a.price) + "</span></label>").join("") + "</div></div>" + (m.err ? '<div class="errors" role="alert">' + esc(m.err) + "</div>" : "") + '<div class="row end"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Add booking</button></div></form>';
  }
  return '<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">' + inner + "</div></div>";
}

// ----- events -----

const UNDO_FORMS = new Set(["report", "approve", "decline", "prices", "client", "pet", "newbooking"]);

async function handleClick(e) {
